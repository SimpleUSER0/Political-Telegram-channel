[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-political-agent"
version = "0.1.0"
description = "Independent Georgian political newsroom with human approval"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.2", "uvicorn==0.54.0", "SQLAlchemy[asyncio]==2.1.4",
  "asyncpg==0.32.0", "aiosqlite==0.22.1", "alembic==1.20.0",
  "pydantic==2.14.1", "pydantic-settings==2.16.0", "openai==3.31.0",
  "httpx==0.28.1", "beautifulsoup4==4.15.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.1"]

[project.scripts]
political-agent = "political_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

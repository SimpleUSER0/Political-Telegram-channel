name: Newsroom checks
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        backend: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: newsroom
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: newsroom_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U newsroom -d newsroom_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install -e '.[dev]'
      - run: ruff check src tests migrations
      - run: ruff format --check src tests migrations
      - run: python -m compileall -q src tests migrations
      - name: SQLite tests and migration check
        if: matrix.backend == 'sqlite'
        run: |
          pytest -q
          political-agent migrate
          alembic check
          political-agent doctor
      - name: PostgreSQL tests and migration check
        if: matrix.backend == 'postgres'
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://newsroom:ci-test-only@localhost:5432/newsroom_test
          DATABASE_URL: postgresql+asyncpg://newsroom:ci-test-only@localhost:5432/newsroom_test
        run: |
          political-agent migrate
          alembic check
          pytest -q
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t political-newsroom:test .
      - name: Start the container without live credentials
        run: docker run --detach --name political-newsroom-smoke --publish 127.0.0.1:8080:8080 political-newsroom:test
      - name: Check container health and safe unconfigured readiness
        run: |
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --max-time 2 http://127.0.0.1:8080/health
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/ready)
          test "$status" = 503
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs political-newsroom-smoke || true
          docker rm --force political-newsroom-smoke || true
